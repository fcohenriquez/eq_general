# Configuracion del modelo CGE Chile - 17 sectores - SAM 2023
# Este archivo separa supuestos, nombres de cuentas y conjuntos del codigo R/.gcn.
# Los conjuntos de 'conjuntos_gcn' deben coincidir con los indexsets del .gcn;
# gecon_chile_17_sect_23.Rmd lo verifica al inicio de la corrida.

modelo:
  nombre: "CGE Chile"
  version: "17sect_2023"
  anio_base: 2023
  descripcion: "Modelo CGE estatico calibrado con SAM Chile 2023, 17 actividades y 21 productos."

archivos:
  # SAM con el bloque institucional conciliado con las cuentas por sector institucional,
  # la balanza de pagos y la recaudacion del SII (sector externo desagregado e Imp_adic).
  # Version '_tesp': los impuestos especificos que gravan las importaciones de tabaco,
  # diesel y gasolinas (988,98 miles de millones) se reclasifican de la fila Arancel a la
  # fila Imptos_Espec, con el ajuste correspondiente en la columna de ingresos del
  # gobierno. Conciliacion con el SII 2023 (miles de millones): tabaco 1.092,7 / 1.092,4;
  # gasolinas 1.827,0 / 1.837,1; diesel neto de recuperaciones 809,1 / 759,8.
  sam: "../data/sam_2023_17sect_sinmg_trab_inst_cft_tesp.csv"
  gcn: "../script/cge_calib_chile_17_sect_23.gcn"
  gcn_template: "cge_calib_chile_template.gcn"
  gcn_output: "cge_calib_chile_17_sect_23_auto.gcn"
  resultados_output: "../output/resultados_shocks_17sect_2023.txt"
  resultados_sens_consumo_comercio: "../output/resultados_sens_consumo_comercio_17sect.txt"
  # Evaluacion de cierres alternativos (eval_cierres_17_sect_23.Rmd)
  resultados_cierres: "../output/resultados_cierres_17sect_2023.txt"
  eval_shocks_rmd: "eval_shocks_17_sect_23.Rmd"

opciones_datos:
  separador_csv: ","
  decimal: "."
  encoding: "UTF-8"
  limpiar_espacios_nombres: true
  reemplazar_na_por_cero: true
  piso_numerico: 1.0e-12
  piso_actividad: 0.1
  piso_importaciones: 1.0e-6

cuentas_sam:
  factores:
    trabajo:
      - "Trabajo_1"
      - "Trabajo_2"
      - "Trabajo_3"
    capital: "Capital"
  instituciones:
    hogares: "Hogares"
    empresas: "Empresas"
    gobierno: "Gobierno"
    resto_mundo: "row"
  ahorro_inversion:
    ahorro_inversion: "S-I"
    variacion_existencias: "Var_Exis"
  impuestos:
    contribuciones_sociales: "Cont_soc"
    prestaciones_sociales: "Pres_soc"
    impuesto_directo: "Imp_dir"
    impuesto_adicional: "Imp_adic"
    impuesto_produccion: "Imp_prod"
    impuestos_especificos: "Imptos_Espec"
    iva: "IVA"
    arancel: "Arancel"

# Sector externo e instituciones (SAM conciliada). Flujos de la SAM que usa el modelo:
#   Empresas <- row  : renta de la inversion directa en el exterior (YROWF), fija en divisas.
#   row <- Empresas  : renta de la inversion pagada al resto del mundo (ROWF).
#   Imp_adic <- row  : Impuesto Adicional de la LIR (TIA = t_ia * ROWF).
#   row <- Hogares   : remesas de los hogares (REMH = por_rem * INC).
#   row <- Trabajo_* : remuneraciones pagadas a no residentes (par_l_out).
#   Hogares <- Gobierno : transferencias del gobierno (TRGOV), que no tributan.
sector_externo:
  # true: las rentas distribuidas por las empresas (a hogares, gobierno y resto del
  # mundo) son proporciones del ingreso neto del IDPC, como en las cuentas nacionales,
  # donde se pagan con cargo al ingreso despues de impuestos. false: proporciones del
  # ingreso bruto (especificacion anterior; un cambio del IDPC recae solo en el ahorro
  # de las empresas).
  distribucion_neta_idpc: true

sectores:
  - id: "Act_Agri"
    etiqueta: "Agropecuario, silvicola y pesca"
    producto_principal: "prod_Agri"
  - id: "Act_Cobre"
    etiqueta: "Mineria del cobre"
    producto_principal: "prod_Cobre"
  - id: "Act_Min_resto"
    etiqueta: "Resto de la mineria (incluye extraccion de petroleo crudo y gas)"
    producto_principal: "prod_Min_resto"
  - id: "Act_Beb_alc"
    etiqueta: "Elaboracion de bebidas alcoholicas"
    producto_principal: "prod_Beb_alc"
  - id: "Act_Beb_noalc"
    etiqueta: "Elaboracion de bebidas no alcoholicas"
    producto_principal: "prod_Beb_noalc"
  - id: "Act_Tabaco"
    etiqueta: "Elaboracion de productos de tabaco"
    producto_principal: "prod_Tabaco"
  - id: "Act_Combustibles"
    etiqueta: "Refinacion de petroleo (diesel, gasolinas y otros combustibles)"
    producto_principal: "prod_Gasolinas"   # produce tambien prod_Diesel y prod_Otros_comb
  - id: "Act_Manu_resto"
    etiqueta: "Resto de la industria manufacturera"
    producto_principal: "prod_Manu_resto"
  - id: "Act_elect_agua_gas"
    etiqueta: "Electricidad, agua, gas y desechos"
    producto_principal: "prod_elect_agua_gas"
  - id: "Act_const"
    etiqueta: "Construccion"
    producto_principal: "prod_const"
  - id: "Act_com_hot_rest"
    etiqueta: "Comercio, hoteles y restaurantes"
    producto_principal: "prod_com_hot_rest"
  - id: "Act_trans_comu_inf"
    etiqueta: "Transporte, comunicaciones e informacion"
    producto_principal: "prod_trans_comu_inf"
  - id: "Act_int_fin"
    etiqueta: "Intermediacion financiera"
    producto_principal: "prod_int_fin"
  - id: "Act_inmo_viv"
    etiqueta: "Servicios inmobiliarios y vivienda"
    producto_principal: "prod_inmo_viv"
  - id: "Act_serv_emp"
    etiqueta: "Servicios empresariales"
    producto_principal: "prod_serv_emp"
  - id: "Act_serv_pers"
    etiqueta: "Servicios personales"
    producto_principal: "prod_serv_pers"
  - id: "Act_adm_pub"
    etiqueta: "Administracion publica"
    producto_principal: "prod_adm_pub"

productos:
  - "prod_Agri"
  - "prod_Cobre"
  - "prod_Crudo"
  - "prod_Min_resto"
  - "prod_Beb_alc"
  - "prod_Beb_noalc"
  - "prod_Tabaco"
  - "prod_Diesel"
  - "prod_Gasolinas"
  - "prod_Otros_comb"
  - "prod_Manu_resto"
  - "prod_elect_agua_gas"
  - "prod_const"
  - "prod_com_hot_rest"
  - "prod_trans_comu_inf"
  - "prod_int_fin"
  - "prod_inmo_viv"
  - "prod_serv_emp"
  - "prod_serv_pers"
  - "prod_adm_pub"
  - "prod_otros"

# Conjuntos usados por el .gcn (deben coincidir con sus indexsets).
# Estructura de la SAM 2023 de 17 sectores que los determina:
#  - Sin consumo de hogares: prod_Cobre, prod_Crudo, prod_Min_resto y prod_const.
#  - Sin exportaciones: prod_const y prod_adm_pub (prod_otros tiene bloque propio).
#  - Sin importaciones: prod_adm_pub.
#  - Construccion como insumo intermedio: solo Act_const, Act_inmo_viv y, de forma
#    marginal (1,2), Act_adm_pub; este ultimo flujo se traslada al capital.
#  - prod_Crudo lo produce solo Act_Min_resto y lo usa solo Act_Combustibles.
conjuntos_gcn:
  LAB:
    incluir:
        - Trabajo_1
        - Trabajo_2
        - Trabajo_3
  P:
    desde: "productos"
  Pdom:
    incluir:
      - "prod_Agri"
      - "prod_Cobre"
      - "prod_Crudo"
      - "prod_Min_resto"
      - "prod_Beb_alc"
      - "prod_Beb_noalc"
      - "prod_Tabaco"
      - "prod_Diesel"
      - "prod_Gasolinas"
      - "prod_Otros_comb"
      - "prod_Manu_resto"
      - "prod_elect_agua_gas"
      - "prod_const"
      - "prod_com_hot_rest"
      - "prod_trans_comu_inf"
      - "prod_int_fin"
      - "prod_inmo_viv"
      - "prod_serv_emp"
      - "prod_serv_pers"
      - "prod_adm_pub"
  Pdom_arm:
    regla: "productos_domesticos_con_importaciones_positivas"
    excluir_manual:
      - "prod_adm_pub"
  Pno_const:
    regla: "todos_los_productos_menos_construccion"
    excluir_manual:
      - "prod_const"
  Pcon:
    regla: "productos_con_consumo_hogares_positivo_o_consumo_residual_fijo"
    excluir_manual:
      - "prod_Cobre"
      - "prod_Crudo"
      - "prod_Min_resto"
      - "prod_const"
  PNC:
    descripcion: "Productos no consumidos directamente por hogares en la utilidad CES"
    incluir:
      - "prod_Cobre"
      - "prod_Crudo"
      - "prod_Min_resto"
      - "prod_const"
  # Nidos de la utilidad CES anidada (ver utilidad_hogares). Presto = Pcon menos el
  # nido unitario y Pcomb.
  Pcomb:
    descripcion: "Nido de combustibles de la utilidad de los hogares"
    incluir:
      - "prod_Diesel"
      - "prod_Gasolinas"
      - "prod_Otros_comb"
  Presto:
    regla: "Pcon_menos_nido_unitario_y_Pcomb"
  P_Exp:
    regla: "productos_con_exportaciones_positivas"
    excluir_manual:
      - "prod_const"
      - "prod_adm_pub"
      - "prod_otros"
  P_NExp:
    regla: "productos_no_exportables_o_con_exportacion_cero_estructural"
    incluir:
      - "prod_const"
      - "prod_adm_pub"
  SA:
    descripcion: "Sectores que excluyen construccion como insumo intermedio por cero estructural"
    incluir:
      - "Act_Agri"
      - "Act_Cobre"
      - "Act_Min_resto"
      - "Act_Beb_alc"
      - "Act_Beb_noalc"
      - "Act_Tabaco"
      - "Act_Combustibles"
      - "Act_Manu_resto"
      - "Act_elect_agua_gas"
      - "Act_com_hot_rest"
      - "Act_trans_comu_inf"
      - "Act_int_fin"
      - "Act_serv_emp"
      - "Act_serv_pers"
      - "Act_adm_pub"
  SB:
    descripcion: "Sectores que usan todos los productos como insumos intermedios"
    incluir:
      - "Act_const"
      - "Act_inmo_viv"
  PMinP:
    descripcion: "Productos domesticos salvo agro, construccion y adm. publica (conjunto declarado en el .gcn; no interviene en las ecuaciones)"
    incluir:
      - "prod_Cobre"
      - "prod_Crudo"
      - "prod_Min_resto"
      - "prod_Beb_alc"
      - "prod_Beb_noalc"
      - "prod_Tabaco"
      - "prod_Diesel"
      - "prod_Gasolinas"
      - "prod_Otros_comb"
      - "prod_Manu_resto"
      - "prod_elect_agua_gas"
      - "prod_com_hot_rest"
      - "prod_trans_comu_inf"
      - "prod_int_fin"
      - "prod_inmo_viv"
      - "prod_serv_emp"
      - "prod_serv_pers"

tratamiento_ceros_estructurales:
  mover_demanda_intermedia_construccion_a_capital: true
  producto_construccion: "prod_const"
  sectores_afectados: "SA"
  destino_rebalanceo: "Capital"
  fijar_consumo_hogares_no_consumidos:
    - "prod_Cobre"
    - "prod_Crudo"
    - "prod_Min_resto"
    - "prod_const"
  fijar_no_exportables:
    - "prod_const"
    - "prod_adm_pub"
  fijar_sin_armington_importado:
    - "prod_adm_pub"

# Utilidad de los hogares: CES anidada en forma de participaciones calibradas
# (Keller, 1976; Perroni y Rutherford, 1995; Rutherford, 1995). El nivel superior
# combina tres compuestos con elasticidad sigma_superior: el bien del nido unitario
# (tabaco), el nido de combustibles (Pcomb, elasticidad sigma_combustibles) y el resto
# del consumo (Presto, elasticidad utilidad_hogares_omega). Los parametros de
# participacion son participaciones en el gasto de la base, de modo que el equilibrio
# base reproduce la SAM para cualquier valor de las elasticidades y estas pueden
# variarse sin recalibrar.
# Elasticidad precio propia no compensada de un bien i del nido n:
#   e_ii = -sigma_n (1 - s_i|n) - sigma_sup s_i|n (1 - S_n) - s_i
# (s_i|n: participacion en el nido; S_n: del nido en el gasto; s_i: del bien en el gasto).
utilidad_hogares:
  especificacion: "ces_anidada"
  nido_unitario: "prod_Tabaco"
  nido_combustibles: "Pcomb"

elasticidades:
  # Elasticidad de sustitucion dentro del nido del resto del consumo (Presto).
  utilidad_hogares_omega: 1.5
  # Nivel superior. Con 0.4, la elasticidad precio propia del tabaco es -0.41, dentro
  # del rango estimado para America Latina y el Caribe (-0.31 corto plazo, -0.43 largo
  # plazo; Guindon et al., 2016) y cercana al valor de -0.4 de los paises de ingreso
  # alto (IARC, 2011).
  utilidad_sigma_superior: 0.4
  # Nido de combustibles. Con 0.2 (y sigma_superior = 0.4), las elasticidades precio
  # propias son -0.33 en gasolinas, -0.23 en diesel y -0.26 en otros combustibles,
  # dentro del rango de la evidencia metaanalitica para la gasolina (-0.09 corto plazo,
  # -0.31 largo plazo corregidas por sesgo de publicacion, Havranek et al., 2012; -0.34
  # corto plazo, Brons et al., 2008).
  utilidad_sigma_combustibles: 0.2
  armington_sigma_q: 2.0
  cet_sigma_t: 1.5
  # Oferta de factores (curvas en terminos reales y netos de impuestos directos).
  # wage_curve_phi: la elasticidad del empleo al salario real neto es 1/(phi*(1-epsilon)).
  #   phi = 3.4483 con epsilon = 0.42 da 0.5, valor central para el insumo laboral total
  #   (hicksianas de 0.3 intensiva y 0.25 extensiva; Chetty et al., 2011).
  wage_curve_phi: 3.4483
  # capital_curve_psi: la elasticidad de la oferta de capital al retorno neto es 1/psi.
  #   psi = 1.5 da 0.67, dentro del consenso de -0.5 a -1.0 para la elasticidad de la
  #   inversion al costo de uso (Hassett y Hubbard, 1996) y coherente con la respuesta
  #   moderada estimada para Chile (Cerda y Larrain, 2005).
  capital_curve_psi: 1.5
  participacion_epsilon: 0.42

cierre_macro:
  # Numerario: IPC (Laspeyres, canasta de consumo de hogares de la base). El modelo es
  # homogeneo de grado cero en precios: curvas de factores, transferencias e impuestos
  # especificos estan indexados al IPC. Prueba de homogeneidad en eval_shocks.Rmd.
  numerario: "IPC"
  valor_numerario: 1.0
  tipo_cambio: "endogeno (real)"
  ahorro_externo: "fijo en moneda extranjera"
  # Inversion determinada por el ahorro: el volumen de inversion se ajusta para que
  # la inversion iguale al ahorro total (hogares, empresas, gobierno y externo).
  # Es el cierre de la calibracion base (sw_joh = 0 en el bloque CIERRE del .gcn).
  inversion: "determinada_por_ahorro"
  # Regla fiscal de la calibracion base: tasas, gasto y transferencias reales fijos;
  # ahorro publico residual (sw_g = sw_tr = 0 en el bloque CIERRE del .gcn).
  fiscal: "ahorro_publico_residual"
  mercado_trabajo: "curva_salarial_con_participacion_endogena"
  mercado_capital: "curva_utilizacion_endogena"
  # Utilizacion base del capital = KD_base / KTOT (KTOT = capacidad instalada).
  # 0.82: uso de capacidad instalada agregado, IMCE ICARE-UAI, dic-2023 (82,0%).
  utilizacion_capital_base: 0.82
  tasa_desempleo_base:
    Trabajo_1: 0.076
    Trabajo_2: 0.099
    Trabajo_3: 0.078

# Cierres alternativos (eval_cierres_17_sect_23.Rmd). Cada cierre combina una regla
# ahorro-inversion y una regla fiscal; el equilibrio base es el mismo en todos.
#   inversion: "determinada_por_ahorro" (sw_joh = 0) | "johansen" (sw_joh = 1: inversion
#              real fija, propension al ahorro de los hogares endogena; Rattso, 1982)
#   fiscal:    "ahorro_publico_residual" (sw_g = sw_tr = 0)
#              | "gasto_endogeno" (sw_g = 1: ahorro publico real fijo, consumo del gobierno
#                en volumen endogeno)
#              | "transferencias_endogenas" (sw_tr = 1: ahorro publico real fijo,
#                transferencias reales a hogares endogenas)
# choques: subconjunto de IVA, IDPC, PIT, TESP (definidos en shocks_default).
cierres_alternativos:
  choques: ["IVA", "IDPC"]
  # La calibracion base se resuelve con tol = 3e-5 (gecon_chile_17_sect_23.Rmd); al
  # resolver de nuevo sin choque, las variables se mueven del orden de 2e-5 en terminos
  # relativos aunque el cierre sea el mismo. La tolerancia de la replica debe ser mayor.
  tolerancia_replica: 1.0e-4
  cierres:
    vigente:
      inversion: "determinada_por_ahorro"
      fiscal: "ahorro_publico_residual"
    johansen:
      inversion: "johansen"
      fiscal: "ahorro_publico_residual"
    gasto_endogeno:
      inversion: "determinada_por_ahorro"
      fiscal: "gasto_endogeno"
    transferencias_endogenas:
      inversion: "determinada_por_ahorro"
      fiscal: "transferencias_endogenas"
    johansen_gasto_endogeno:
      inversion: "johansen"
      fiscal: "gasto_endogeno"

# Pruebas de consistencia del cierre (eval_shocks.Rmd)
pruebas_cierre:
  # Con el numerario en este valor, todos los precios y flujos nominales deben
  # escalar por el mismo factor y las cantidades no deben cambiar.
  numerario_prueba_homogeneidad: 1.1
  tolerancia: 1.0e-5

# Sensibilidad a las elasticidades de oferta de factores (eval_shocks.Rmd).
# elasticidad_empleo: elasticidad del empleo al salario real neto, 1 / (phi * (1 - epsilon)).
#   0.5 = calibracion central; 0.25 = cota inferior (margen extensivo, Chetty et al., 2011).
# capital_curve_psi: la elasticidad de la oferta de capital al retorno neto es 1 / psi.
#   1.5 = calibracion central (elasticidad 0.67); 1 y 2 acotan el rango de consenso
#   (elasticidad 1 y 0.5); 0.2 (elasticidad 5) se mantiene como prueba de estres.
# Ningun valor altera el equilibrio base (w = pk = 1), por lo que se varian sin recalibrar.
sensibilidad_oferta:
  elasticidad_empleo: [0.862, 0.5, 0.25]
  capital_curve_psi: [0.2, 1.0, 1.5, 2.0]

# Especificacion del IVA: cuna de precio sobre la demanda final, uso intermedio
# desgravado. El IVA que exceda la tasa tope sobre la demanda final de un producto
# se asigna como residuo transitorio a su uso intermedio (t_iva_int), salvo en los
# productos de 'productos_impuesto_adicional'.
iva:
  especificacion: "cuna_precio_demanda_final"
  tasa_max_demanda_final: 0.19

# Impuestos adicionales ad valorem sobre bebidas (IABA y bebidas analcoholicas, art. 42
# del DL 825). La SAM los registra en la fila IVA: la tasa implicita sobre la demanda
# final es 33,9% en bebidas alcoholicas y 22,5% en no alcoholicas. En estos productos,
# el exceso sobre la tasa tope del IVA se modela como un impuesto adicional ad valorem
# (t_adic) que grava la demanda final sobre la misma base que el IVA:
#     pq = (p + tau_e * IPC) * (1 + t_iva + t_adic)
# Su recaudacion se reporta como TADIC, separada del IVA; VAT + TADIC replica la fila IVA.
# El choque de IVA no altera t_adic.
# NOTA: t_adic y TADIC designan aqui el impuesto adicional a las bebidas. El Impuesto
# Adicional de la LIR (cuenta Imp_adic de la SAM) se denomina t_ia y TIA, como en el
# modelo de 12 sectores.
impuesto_adicional:
  especificacion: "ad_valorem_demanda_final_misma_base_iva"
  productos:
    - "prod_Beb_alc"
    - "prod_Beb_noalc"

# Especificacion de impuestos especificos: impuesto por unidad fisica (tau_e, indexado
# al IPC) que paga la demanda final (hogares, gobierno, inversion) y, en los productos
# de 'productos_uso_intermedio', tambien el uso intermedio con el monto kappa_e * tau_e.
# Existencias y exportaciones no lo pagan. El IVA de la demanda final se calcula sobre el
# precio con especifico.
#     pq   = (p + tau_e * IPC) * (1 + t_iva + t_adic)
#     pint = p * (1 + t_iva_int) + kappa_e * tau_e * IPC
#     TESP = tau_e * IPC * (FD + kappa_e * XI)
# En la SAM recaen en prod_Tabaco, prod_Diesel, prod_Gasolinas y prod_Otros_comb (en este
# ultimo, el impuesto a los vehiculos a gas licuado, 4,1 miles de millones).
# - El especifico de los combustibles grava la primera venta o importacion, cualquiera sea
#   el uso (Ley 18.502, art. 6); el del tabaco grava cigarrillos y tabaco elaborado (DL
#   828), por lo que su uso intermedio (hoja de tabaco) no lo paga.
# - recuperacion_uso_intermedio: fraccion del impuesto bruto que se recupera; recae solo
#   sobre el uso intermedio y determina kappa_e mediante
#       (1 - kappa_e) * XI = rho * (FD + XI).
#   Diesel: credito especial (art. 7, Ley 18.502) y recuperacion del transporte de carga
#   (Ley 19.764). SII 2023 (miles de millones): impuesto bruto 1.553,5 (nacional 639,5 e
#   importado 914,0); credito especial 697,7 y recuperacion del transporte de carga 96,0:
#   rho = (697,7 + 96,0) / 1.553,5 = 0,5109 (Serie de Ingresos Tributarios Anuales
#   Consolidados 2009-2025).
tesp:
  especificacion: "unitario_demanda_final_y_uso_intermedio"
  productos_uso_intermedio:
    - "prod_Diesel"
    - "prod_Gasolinas"
    - "prod_Otros_comb"
  recuperacion_uso_intermedio:
    prod_Diesel: 0.5109

shocks_default:
  tesp:
    descripcion: "Aumento de 10% en el impuesto especifico por unidad fisica (tau_e) del diesel y las gasolinas"
    tipo: "multiplicativo"
    factor: 1.10
    # Productos a los que se aplica el factor. Vacio o ausente: todos los productos
    # con tau_e > 0 (prod_Tabaco, prod_Diesel, prod_Gasolinas, prod_Otros_comb).
    # Se excluye prod_Otros_comb: su especifico (4,1 miles de millones) corresponde al
    # impuesto anual a los vehiculos a gas licuado, no a un impuesto por unidad de
    # combustible de la Ley 18.502 (art. 6).
    productos:
      - "prod_Diesel"
      - "prod_Gasolinas"
  iva:
    descripcion: "Alza de la tasa legal de IVA de 19% a 20% (tasas efectivas sin impuesto x 20/19)"
    tipo: "multiplicativo"
    factor: 1.0526315789473684
  pit:
    descripcion: "Aumento de 10% en la carga efectiva de impuesto a personas"
    tipo: "multiplicativo"
    factor: 1.10
  fit:
    descripcion: "Disminucion de 1 punto en la tasa nominal de IDPC, ajustada por participacion del IDPC en FIRMTAX"
    tipo: "formula"
    tasa_nominal_base: 0.27
    cambio_puntos_tasa: -0.01
    participacion_idpc_en_firmtax: 0.916
    fuente_chi: "IDPC devengado SII / Imp_dir empresas Banco Central, 2023"
    formula_factor: "1 + cambio_puntos_tasa * participacion_idpc_en_firmtax / tasa_nominal_base"


# Sensibilidad de consumo y comercio exterior (sens_consumo_comercio.Rmd). Con la
# utilidad anidada, omega es la elasticidad del nido del resto del consumo; sigma_sup,
# la del nivel superior (tabaco, combustibles y resto), y sigma_comb, la del nido de
# combustibles. Como los parametros de participacion de la utilidad no dependen de las
# elasticidades, estas se varian sin recalibrar; delta_m, aq, gamma_e y at se recalculan
# para cada (sigma_q, sigma_t).
#   sigma_sup: 0.3 y 0.5 llevan la elasticidad del tabaco a -0.31 y -0.50 (corto y
#              largo plazo en America Latina y el Caribe, -0.31 y -0.43; Guindon et al., 2016).
#   sigma_comb: 0.1 y 0.3 (con sigma_sup = 0.4) llevan la de las gasolinas a -0.29 y
#              -0.37, y la del diesel a -0.14 y -0.32 (Havranek et al., 2012; Brons et al., 2008).
#   exclusion_omega_unitario: se excluyen de las tres grillas de la utilidad los valores a
#              menos de esta distancia de 1 (CES singular).
#   umbral_invariancia_pp: amplitud de la variacion total (pp del PIB) bajo la cual la
#              redaccion considera el resultado invariante a la elasticidad.
sensibilidad_consumo_comercio:
  parametros: [omega, sigma_sup, sigma_comb, sigma_q, sigma_t]
  omega:      [0.5, 0.8, 1.2, 1.5, 2.0]
  sigma_sup:  [0.3, 0.4, 0.5]
  sigma_comb: [0.1, 0.2, 0.3]
  sigma_q:    [1.4, 2.0, 2.9, 3.8]
  sigma_t:    [0.6, 1.0, 1.5, 3.0]
  exclusion_omega_unitario: 0.05
  umbral_invariancia_pp: 0.002


validaciones:
  verificar_balance_sam: true
  tolerancia_balance_sam: 1.0e-3
  verificar_cuentas_requeridas: true
  verificar_dimensiones_make_io: true
  verificar_productos_y_sectores_en_sam: true
  verificar_conjuntos_gcn: true
  advertir_flujos_negativos: true
  # Arancel general (6%): una tasa efectiva mayor sugiere impuestos especificos
  # registrados en la fila de aranceles de la SAM.
  tasa_maxima_arancel: 0.06
