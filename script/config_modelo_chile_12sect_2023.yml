# Configuracion del modelo CGE Chile - 12 sectores - SAM 2023
# Este archivo separa supuestos, nombres de cuentas y conjuntos del codigo R/.gcn.

modelo:
  nombre: "CGE Chile"
  version: "12sect_2023"
  anio_base: 2023
  descripcion: "Modelo CGE estatico calibrado con SAM Chile 2023, 12 actividades y 13 productos."

archivos:
  sam: "../data/sam_2023_12sect_sinmg_trab.csv"
  gcn_template: "cge_calib_chile_template.gcn"
  gcn_output: "cge_calib_chile_12_sect_23_auto.gcn"
  resultados_output: "../output/resultados_shocks_12sect_2023.txt"
  resultados_sens_consumo_comercio: "../output/resultados_sens_consumo_comercio.txt"

opciones_datos:
  separador_csv: ","
  decimal: "."
  encoding: "UTF-8"
  limpiar_espacios_nombres: true
  reemplazar_na_por_cero: true
  piso_numerico: 1.0e-12
  piso_actividad: 0.1
  piso_importaciones: 1.0e-6

cuentas_sam:
  factores:
    trabajo:
      - "Trabajo_1"
      - "Trabajo_2"
      - "Trabajo_3"
    capital: "Capital"
  instituciones:
    hogares: "Hogares"
    empresas: "Empresas"
    gobierno: "Gobierno"
    resto_mundo: "row"
  ahorro_inversion:
    ahorro_inversion: "S-I"
    variacion_existencias: "Var_Exis"
  impuestos:
    contribuciones_sociales: "Cont_soc"
    prestaciones_sociales: "Pres_soc"
    impuesto_directo: "Imp_dir"
    impuesto_produccion: "Imp_prod"
    impuestos_especificos: "Imptos_Espec"
    iva: "IVA"
    arancel: "Arancel"

sectores:
  - id: "Act_Agri"
    etiqueta: "Agropecuario, silvicola y pesca"
    producto_principal: "prod_Agri"
  - id: "Act_Min"
    etiqueta: "Mineria"
    producto_principal: "prod_Min"
  - id: "Act_Manu"
    etiqueta: "Manufactura"
    producto_principal: "prod_Manu"
  - id: "Act_elect_agua_gas"
    etiqueta: "Electricidad, agua, gas y desechos"
    producto_principal: "prod_elect_agua_gas"
  - id: "Act_const"
    etiqueta: "Construccion"
    producto_principal: "prod_const"
  - id: "Act_com_hot_rest"
    etiqueta: "Comercio, hoteles y restaurantes"
    producto_principal: "prod_com_hot_rest"
  - id: "Act_trans_comu_inf"
    etiqueta: "Transporte, comunicaciones e informacion"
    producto_principal: "prod_trans_comu_inf"
  - id: "Act_int_fin"
    etiqueta: "Intermediacion financiera"
    producto_principal: "prod_int_fin"
  - id: "Act_inmo_viv"
    etiqueta: "Servicios inmobiliarios y vivienda"
    producto_principal: "prod_inmo_viv"
  - id: "Act_serv_emp"
    etiqueta: "Servicios empresariales"
    producto_principal: "prod_serv_emp"
  - id: "Act_serv_pers"
    etiqueta: "Servicios personales"
    producto_principal: "prod_serv_pers"
  - id: "Act_adm_pub"
    etiqueta: "Administracion publica"
    producto_principal: "prod_adm_pub"

productos:
  - "prod_Agri"
  - "prod_Min"
  - "prod_Manu"
  - "prod_elect_agua_gas"
  - "prod_const"
  - "prod_com_hot_rest"
  - "prod_trans_comu_inf"
  - "prod_int_fin"
  - "prod_inmo_viv"
  - "prod_serv_emp"
  - "prod_serv_pers"
  - "prod_adm_pub"
  - "prod_otros"

# Conjuntos usados actualmente por el .gcn.
# En una segunda etapa, varios de estos pueden calcularse automaticamente desde la SAM.
conjuntos_gcn:
  LAB:
    incluir:
        - Trabajo_1
        - Trabajo_2
        - Trabajo_3
  P:
    desde: "productos"
  Pdom:
    incluir:
      - "prod_Agri"
      - "prod_Min"
      - "prod_Manu"
      - "prod_elect_agua_gas"
      - "prod_const"
      - "prod_com_hot_rest"
      - "prod_trans_comu_inf"
      - "prod_int_fin"
      - "prod_inmo_viv"
      - "prod_serv_emp"
      - "prod_serv_pers"
      - "prod_adm_pub"
  Pdom_arm:
    regla: "productos_domesticos_con_importaciones_positivas"
    excluir_manual:
      - "prod_adm_pub"
  Pno_const:
    regla: "todos_los_productos_menos_construccion"
    excluir_manual:
      - "prod_const"
  Pcon:
    regla: "productos_con_consumo_hogares_positivo_o_consumo_residual_fijo"
    excluir_manual:
      - "prod_Min"
      - "prod_const"
  PNC:
    descripcion: "Productos no consumidos directamente por hogares en la utilidad CES"
    incluir:
      - "prod_Min"
      - "prod_const"
  P_Exp:
    regla: "productos_con_exportaciones_positivas"
    excluir_manual:
      - "prod_const"
      - "prod_adm_pub"
      - "prod_otros"
  P_NExp:
    regla: "productos_no_exportables_o_con_exportacion_cero_estructural"
    incluir:
      - "prod_const"
      - "prod_adm_pub"
  SA:
    descripcion: "Sectores que excluyen construccion como insumo intermedio por cero estructural"
    incluir:
      - "Act_Agri"
      - "Act_Min"
      - "Act_Manu"
      - "Act_elect_agua_gas"
      - "Act_com_hot_rest"
      - "Act_trans_comu_inf"
      - "Act_int_fin"
      - "Act_serv_emp"
      - "Act_serv_pers"
      - "Act_adm_pub"
  SB:
    descripcion: "Sectores que usan todos los productos como insumos intermedios"
    incluir:
      - "Act_const"
      - "Act_inmo_viv"
  PMinP:
    descripcion: "Productos usados en bloque especial de absorcion domestica, excluye agro, construccion, adm. publica y otros"
    incluir:
      - "prod_Min"
      - "prod_Manu"
      - "prod_elect_agua_gas"
      - "prod_com_hot_rest"
      - "prod_trans_comu_inf"
      - "prod_int_fin"
      - "prod_inmo_viv"
      - "prod_serv_emp"
      - "prod_serv_pers"

tratamiento_ceros_estructurales:
  mover_demanda_intermedia_construccion_a_capital: true
  producto_construccion: "prod_const"
  sectores_afectados: "SA"
  destino_rebalanceo: "Capital"
  fijar_consumo_hogares_no_consumidos:
    - "prod_Min"
    - "prod_const"
  fijar_no_exportables:
    - "prod_const"
    - "prod_adm_pub"
  fijar_sin_armington_importado:
    - "prod_adm_pub"

elasticidades:
  utilidad_hogares_omega: 1.5
  armington_sigma_q: 2.0
  cet_sigma_t: 1.5
  # Oferta de factores (curvas en terminos reales y netos de impuestos directos).
  # wage_curve_phi: la elasticidad del empleo al salario real neto es 1/(phi*(1-epsilon)).
  #   phi = 3.4483 con epsilon = 0.42 da 0.5, valor central para el insumo laboral total
  #   (hicksianas de 0.3 intensiva y 0.25 extensiva; Chetty et al., 2011).
  #   Valor anterior: 2.0 (elasticidad 0.862).
  wage_curve_phi: 3.4483
  # capital_curve_psi: la elasticidad de la oferta de capital al retorno neto es 1/psi.
  #   psi = 1.5 da 0.67, dentro del consenso de -0.5 a -1.0 para la elasticidad de la
  #   inversion al costo de uso (Hassett y Hubbard, 1996) y coherente con la respuesta
  #   moderada estimada para Chile (Cerda y Larrain, 2005). Valor anterior: 0.2 (elasticidad 5).
  capital_curve_psi: 1.5
  participacion_epsilon: 0.42

cierre_macro:
  # Numerario: IPC (Laspeyres, canasta de consumo de hogares de la base). El modelo es
  # homogeneo de grado cero en precios: curvas de factores, transferencias e impuestos
  # especificos estan indexados al IPC. Prueba de homogeneidad en eval_shocks.Rmd.
  numerario: "IPC"
  valor_numerario: 1.0
  tipo_cambio: "endogeno (real)"
  ahorro_externo: "fijo en moneda extranjera"
  # Inversion determinada por el ahorro: el volumen de inversion se ajusta para que
  # la inversion iguale al ahorro total (hogares, empresas, gobierno y externo).
  inversion: "determinada_por_ahorro"
  #mercado_trabajo: "curva_salarial_con_desempleo"
  mercado_trabajo: "curva_salarial_con_participacion_endogena"
  #mercado_capital: "pleno_uso_stock_capital"
  mercado_capital: "curva_utilizacion_endogena"
  # Utilizacion base del capital = KD_base / KTOT (KTOT = capacidad instalada).
  # 0.82: uso de capacidad instalada agregado, IMCE ICARE-UAI, dic-2023 (82,0%).
  # Con 1.0 se recupera la calibracion anterior (pleno uso en la base).
  utilizacion_capital_base: 0.82
  tasa_desempleo_base:
    Trabajo_1: 0.076
    Trabajo_2: 0.099
    Trabajo_3: 0.078

# Pruebas de consistencia del cierre (eval_shocks.Rmd)
pruebas_cierre:
  # Con el numerario en este valor, todos los precios y flujos nominales deben
  # escalar por el mismo factor y las cantidades no deben cambiar.
  numerario_prueba_homogeneidad: 1.1
  tolerancia: 1.0e-5

# Sensibilidad a las elasticidades de oferta de factores (eval_shocks.Rmd).
# elasticidad_empleo: elasticidad del empleo al salario real neto, 1 / (phi * (1 - epsilon)).
#   0.5 = calibracion central; 0.25 = cota inferior (margen extensivo, Chetty et al., 2011);
#   0.862 = calibracion anterior (phi = 2), como referencia.
# capital_curve_psi: la elasticidad de la oferta de capital al retorno neto es 1 / psi.
#   1.5 = calibracion central (elasticidad 0.67); 1 y 2 acotan el rango de consenso
#   (elasticidad 1 y 0.5); 0.2 = calibracion anterior (elasticidad 5), como referencia.
# Ningun valor altera el equilibrio base (w = pk = 1), por lo que se varian sin recalibrar.
sensibilidad_oferta:
  elasticidad_empleo: [0.862, 0.5, 0.25]
  capital_curve_psi: [0.2, 1.0, 1.5, 2.0]

# Especificacion del IVA (Etapa 1): cuna de precio sobre la demanda final,
# uso intermedio desgravado. El IVA que exceda la tasa tope sobre la demanda
# final de un producto se asigna como residuo transitorio a su uso intermedio.
iva:
  especificacion: "cuna_precio_demanda_final"
  tasa_max_demanda_final: 0.19

# Especificacion de impuestos especificos (Etapa 5): impuesto por unidad fisica que pagan
# solo hogares, gobierno e inversion. Consumo intermedio, existencias y exportaciones no
# lo pagan (supuesto). El IVA se calcula sobre el precio con especifico.
tesp:
  especificacion: "unitario_demanda_final"

shocks_default:
  tesp:
    descripcion: "Aumento de 10% en el impuesto especifico por unidad fisica (tau_e)"
    tipo: "multiplicativo"
    factor: 1.10
  iva:
    descripcion: "Alza de la tasa legal de IVA de 19% a 20% (tasas efectivas sin impuesto x 20/19)"
    tipo: "multiplicativo"
    factor: 1.0526315789473684
  pit:
    descripcion: "Aumento de 10% en la carga efectiva de impuesto a personas"
    tipo: "multiplicativo"
    factor: 1.10
  fit:
    descripcion: "Disminucion de 1 punto en la tasa nominal de IDPC, ajustada por participacion del IDPC en FIRMTAX"
    tipo: "formula"
    tasa_nominal_base: 0.27
    cambio_puntos_tasa: -0.01
    participacion_idpc_en_firmtax: 0.916
    fuente_chi: "IDPC devengado SII / Imp_dir empresas Banco Central, 2023"
    formula_factor: "1 + cambio_puntos_tasa * participacion_idpc_en_firmtax / tasa_nominal_base"


sensibilidad_consumo_comercio:
  parametros: [omega, sigma_q, sigma_t]
  omega:   [0.5, 0.8, 1.2, 1.5, 2.0]
  sigma_q: [1.4, 2.0, 2.9, 3.8]
  sigma_t: [0.6, 1.0, 1.5, 3.0]
  exclusion_omega_unitario: 0.05


validaciones:
  verificar_balance_sam: true
  tolerancia_balance_sam: 1.0e-6
  verificar_cuentas_requeridas: true
  verificar_dimensiones_make_io: true
  verificar_productos_y_sectores_en_sam: true
  advertir_flujos_negativos: true
